plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    
    compileSdk = flutter.compileSdkVersion
    
    // CORREÇÃO: O namespace deve ter o formato de domínio reverso (ex: com.app.nome).
    // Usamos o valor do applicationId, que é 'Comppare', e colocamos em formato de domínio.
    namespace 'com.thiagogomes.comppare' 
    
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        // CORREÇÃO: Usar a propriedade correta. O valor já é o default para 1.8.
        jvmTarget = '1.8'
    }

    defaultConfig {
        // O valor do applicationId é 'Comppare'
        applicationId = "com.thiagogomes.comppare" // << CORREÇÃO: Deve ser o mesmo do namespace
        
        // Você pode ter que ajustar este valor se o nome original for exatamente "Comppare"
        // Se o nome original for "Comppare", use: applicationId = "Comppare" e mude o namespace.
        // Vou assumir que você deseja o formato completo.
        
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}